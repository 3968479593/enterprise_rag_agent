# 企业文档智能客服 —— 纯运行版编排（用于分发到其他机器）
#
# 对方机器只需要三样东西：
#   1. rag-agent-images.tar        （docker save 导出的镜像包）
#   2. 本文件 docker-compose.deploy.yml
#   3. .env                        （照着 backend/.env.example 填自己的密钥）
#
# 部署步骤：
#   docker load -i rag-agent-images.tar
#   docker compose -f docker-compose.deploy.yml up -d

services:
  backend:
    image: enterprise-rag-backend:1.0
    container_name: rag-backend
    working_dir: /app
    ports:
      - "8001:8001"
    env_file:
      - ./.env
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: sqlite:////app/data/rag.db
      CHROMA_PERSIST_DIR: /app/data/chroma_db
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - rag_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8001/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  frontend:
    image: enterprise-rag-frontend:1.0
    container_name: rag-frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rag_data:
    name: rag_data
